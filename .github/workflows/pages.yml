name: Deploy Atlas to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Atlas site
        run: |
          rm -rf _site
          cp -R docs _site
          python - <<'PY'
          from pathlib import Path
          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")

          script_needle = '  <script src="app.js"></script>'
          script_injection = script_needle + '\n  <script src="payday.js"></script>'
          if 'src="payday.js"' not in html:
              if script_needle not in html:
                  raise SystemExit("app.js script tag not found")
              html = html.replace(script_needle, script_injection, 1)

          css_needle = '  <link rel="stylesheet" href="styles.css" />'
          css_injection = css_needle + '\n  <link rel="stylesheet" href="payday-fix.css" />'
          if 'href="payday-fix.css"' not in html:
              if css_needle not in html:
                  raise SystemExit("styles.css link not found")
              html = html.replace(css_needle, css_injection, 1)

          path.write_text(html, encoding="utf-8")
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
