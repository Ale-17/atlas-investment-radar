name: Deploy Atlas to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Atlas site
        run: |
          rm -rf _site
          cp -R docs _site
          python - <<'PY'
          from pathlib import Path

          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")

          # Core stylesheet + safety + premium layer, in that order.
          css_anchor = '  <link rel="stylesheet" href="styles.css" />'
          payday_css = '  <link rel="stylesheet" href="payday-fix.css" />'
          premium_css = '  <link rel="stylesheet" href="premium.css" />'
          if css_anchor not in html:
              raise SystemExit("styles.css link not found")
          if payday_css not in html:
              html = html.replace(css_anchor, css_anchor + '\n' + payday_css, 1)
          if premium_css not in html:
              anchor = payday_css if payday_css in html else css_anchor
              html = html.replace(anchor, anchor + '\n' + premium_css, 1)

          # Runtime modules. Polish loads last so it can enhance dynamic modules safely.
          app_script = '  <script src="app.js"></script>'
          payday_script = '  <script src="payday.js"></script>'
          news_script = '  <script src="news.js"></script>'
          polish_script = '  <script src="polish.js"></script>'
          if app_script not in html:
              raise SystemExit("app.js script tag not found")
          if payday_script not in html:
              html = html.replace(app_script, app_script + '\n' + payday_script, 1)
          if news_script not in html:
              anchor = payday_script if payday_script in html else app_script
              html = html.replace(anchor, anchor + '\n' + news_script, 1)
          if polish_script not in html:
              anchor = news_script if news_script in html else payday_script
              html = html.replace(anchor, anchor + '\n' + polish_script, 1)

          # Present the deployed build as Atlas V6 without changing application logic.
          html = html.replace(
              '<title>Atlas V5 — Personal Finance & Investment Radar</title>',
              '<title>Atlas V6 — Personal Finance & Investment Radar</title>'
          )

          path.write_text(html, encoding="utf-8")

          # Fail rather than publish an incomplete mobile/premium build.
          final = path.read_text(encoding="utf-8")
          required = [
              'href="payday-fix.css"',
              'href="premium.css"',
              'src="payday.js"',
              'src="news.js"',
              'src="polish.js"',
          ]
          missing = [x for x in required if x not in final]
          if missing:
              raise SystemExit(f"Missing published Atlas assets: {missing}")
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
