name: Deploy Atlas to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Atlas site
        run: |
          rm -rf _site
          cp -R docs _site
          python - <<'PY'
          from pathlib import Path
          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")
          needle = '  <script src="app.js"></script>'
          scripts = needle + '\n  <script src="payday.js"></script>\n  <script src="news.js"></script>'
          if needle not in html:
              raise SystemExit("app.js script tag not found")
          if 'src="payday.js"' not in html and 'src="news.js"' not in html:
              html = html.replace(needle, scripts, 1)
          else:
              if 'src="payday.js"' not in html:
                  html = html.replace(needle, needle + '\n  <script src="payday.js"></script>', 1)
              if 'src="news.js"' not in html:
                  anchor = '  <script src="payday.js"></script>'
                  html = html.replace(anchor, anchor + '\n  <script src="news.js"></script>', 1)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
