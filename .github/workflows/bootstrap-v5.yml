name: Bootstrap Atlas V5

on:
  push:
    paths:
      - ".github/workflows/bootstrap-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and validate Atlas V5 package
        run: |
          cat \
            _bootstrap/b64-00 \
            _bootstrap/b64-01a \
            _bootstrap/b64-01b \
            _bootstrap/b64-02 \
            _bootstrap/b64-03 \
            _bootstrap/b64-04 \
            _bootstrap/b64-05 \
            _bootstrap/b64-06 \
            _bootstrap/b64-07 \
            _bootstrap/b64-08 \
            _bootstrap/b64-09 \
            _bootstrap/b64-10 \
            | base64 -d > /tmp/atlas-v5.zip
          test "$(wc -c < /tmp/atlas-v5.zip)" -eq 49350
          unzip -t /tmp/atlas-v5.zip
          unzip -o /tmp/atlas-v5.zip -d .

      - name: Keep repository workflows unchanged
        run: |
          git restore --source=HEAD -- \
            .github/workflows/backtest.yml \
            .github/workflows/validate.yml \
            .github/workflows/pages.yml \
            .github/workflows/update-market.yml \
            .github/workflows/bootstrap-v5.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate first market snapshot
        run: python src/run.py

      - name: Generate first backtest
        run: python src/backtest.py

      - name: Commit Atlas V5 application
        run: |
          git config user.name "atlas-bootstrap"
          git config user.email "atlas-bootstrap@users.noreply.github.com"
          git add \
            .gitignore \
            README.md \
            STRATEGY.md \
            DECISION_ENGINE.md \
            DEPLOYMENT.md \
            GOALS_RULES.md \
            PORTFOLIO_RULES.md \
            BACKTEST_RULES.md \
            BUDGET_RULES.md \
            requirements.txt \
            src config docs data
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "Install Atlas V5 application"
          git push
