name: Update investment dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7,12,17,21 * * 1-5"
    - cron: "20 10 * * 0,6"

permissions:
  contents: write

concurrency:
  group: investment-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate signals
        run: python src/run.py
      - name: Commit data
        run: |
          git config user.name "investment-bot"
          git config user.email "investment-bot@users.noreply.github.com"
          git add docs/data/latest.json data/history
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update market signals"
          git push
